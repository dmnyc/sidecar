<!--
  Metropolis — the sunburst. Real strokes, not a repeating-conic-gradient.

  The conic version could not be made clean: at the ray width this theme wants (0.14deg)
  a ray is 0.17px across near the vertex and about 1.5px far from it, so the rasteriser
  rendered them at uneven weights, stair-stepped them, and landed the left and right
  halves on different pixel boundaries — asymmetric on screen from perfectly symmetric
  maths. Strokes have a width in user units instead of an angle, so they antialias
  properly and hold the same weight the whole way down.

  SYMMETRIC BY CONSTRUCTION, not by arithmetic: 59 rays drawn at k*2.6deg for k in
  -29..29, so every ray has a mirror and k=0 is the vertical spine. Nothing to get wrong
  in a `from` angle.

  Sized 400x1200 with the vertex 70 units above the frame. Used at
  background-size 100% auto, so the SVG scales to the panel's width and the stroke scales
  with it — 1px at a 400px panel, ~1.9px at 754 — which is what keeps it smooth at any
  width instead of thinning into sub-pixel territory.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1200" width="400" height="1200">
<g stroke="#D3A94E" stroke-opacity="0.42" stroke-width="1" fill="none"><line x1="200.0" y1="-70.0" x2="-2122.50" y2="534.97"/><line x1="200.0" y1="-70.0" x2="-2092.67" y2="639.70"/><line x1="200.0" y1="-70.0" x2="-2058.11" y2="742.97"/><line x1="200.0" y1="-70.0" x2="-2018.91" y2="844.57"/><line x1="200.0" y1="-70.0" x2="-1975.14" y2="944.28"/><line x1="200.0" y1="-70.0" x2="-1926.89" y2="1041.91"/><line x1="200.0" y1="-70.0" x2="-1874.26" y2="1137.25"/><line x1="200.0" y1="-70.0" x2="-1817.36" y2="1230.10"/><line x1="200.0" y1="-70.0" x2="-1756.31" y2="1320.27"/><line x1="200.0" y1="-70.0" x2="-1691.23" y2="1407.59"/><line x1="200.0" y1="-70.0" x2="-1622.25" y2="1491.86"/><line x1="200.0" y1="-70.0" x2="-1549.52" y2="1572.91"/><line x1="200.0" y1="-70.0" x2="-1473.20" y2="1650.59"/><line x1="200.0" y1="-70.0" x2="-1393.42" y2="1724.72"/><line x1="200.0" y1="-70.0" x2="-1310.37" y2="1795.15"/><line x1="200.0" y1="-70.0" x2="-1224.21" y2="1861.75"/><line x1="200.0" y1="-70.0" x2="-1135.11" y2="1924.36"/><line x1="200.0" y1="-70.0" x2="-1043.26" y2="1982.87"/><line x1="200.0" y1="-70.0" x2="-948.86" y2="2037.16"/><line x1="200.0" y1="-70.0" x2="-852.09" y2="2087.11"/><line x1="200.0" y1="-70.0" x2="-753.15" y2="2132.61"/><line x1="200.0" y1="-70.0" x2="-652.26" y2="2173.58"/><line x1="200.0" y1="-70.0" x2="-549.60" y2="2209.93"/><line x1="200.0" y1="-70.0" x2="-445.41" y2="2241.59"/><line x1="200.0" y1="-70.0" x2="-339.88" y2="2268.49"/><line x1="200.0" y1="-70.0" x2="-233.25" y2="2290.57"/><line x1="200.0" y1="-70.0" x2="-125.72" y2="2307.79"/><line x1="200.0" y1="-70.0" x2="-17.52" y2="2320.12"/><line x1="200.0" y1="-70.0" x2="91.13" y2="2327.53"/><line x1="200.0" y1="-70.0" x2="200.00" y2="2330.00"/><line x1="200.0" y1="-70.0" x2="308.87" y2="2327.53"/><line x1="200.0" y1="-70.0" x2="417.52" y2="2320.12"/><line x1="200.0" y1="-70.0" x2="525.72" y2="2307.79"/><line x1="200.0" y1="-70.0" x2="633.25" y2="2290.57"/><line x1="200.0" y1="-70.0" x2="739.88" y2="2268.49"/>