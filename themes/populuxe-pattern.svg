<!-- Sidecar — Populuxe background pattern.
     Starbursts and boomerangs on a 2x2 arrangement of 160px cells, so the 320px tile
     repeats seamlessly: every motif is wholly contained in its own cell and nothing
     crosses an edge.

     SPARSE ON PURPOSE. The reference sheets for this style are dense — sixty motifs on
     one page — and that density is the reason the style is usually done badly on screen.
     Film Noir's venetian blinds are the precedent here for how much texture a panel
     tolerates before it fights the text, and this is a LIGHT theme, where every mark
     costs more: ink on white is a bigger step than a highlight on near-black. Four
     motifs per tile, drawn as hairlines in the theme ink at 0.05 alpha, so it reads as
     the stock's printed texture rather than as wallpaper.

     Two motifs only, alternating: the atomic starburst and the boomerang. Both are
     drawn as OUTLINES, not fills — the period's linework is what carries, and a filled
     silhouette at this scale reads as a blob at panel width. -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <g stroke="#1C1A17" stroke-opacity="0.05" fill="none" stroke-width="1.25" stroke-linecap="round">

    <!-- cell 1 (0,0): the atomic starburst — eight rays, long/short alternating, each
         tipped with the small dot the period drew at the end of a ray. -->
    <g transform="translate(80 80)">
      <path d="M0-30V30M-30 0H30M-21-21 21 21M-21 21 21-21"/>
      <path d="M0-17V17M-17 0H17" transform="rotate(22.5)"/>
      <circle cx="0" cy="-30" r="2"/><circle cx="0" cy="30" r="2"/>
      <circle cx="-30" cy="0" r="2"/><circle cx="30" cy="0" r="2"/>
    </g>

    <!-- cell 2 (160,0): the boomerang. Two arcs closed at the tips, the shape that ran
         on every coffee table and countertop of the decade. -->
    <g transform="translate(240 80) rotate(-18)">
      <path d="M-34-14C-12-2 12-2 34-14 22 6 6 16-2 30-10 16-22 6-34-14Z"/>
    </g>

    <!-- cell 3 (0,160): starburst again, rotated and smaller, so the grid does not read
         as a stamp repeating on a fixed axis. -->
    <g transform="translate(80 240) rotate(15)">
      <path d="M0-22V22M-22 0H22M-15-15 15 15M-15 15 15-15"/>
      <circle cx="0" cy="0" r="3"/>
    </g>

    <!-- cell 4 (160,160): the ellipse-and-ray, the third motif the period used between
         the other two — an atom's orbit read flat. -->
    <g transform="translate(240 240) rotate(-30)">
      <ellipse cx="0" cy="0" rx="30" ry="12"/>
      <ellipse cx="0" cy="0" rx="30" ry="12" transform="rotate(60)"/>
      <circle cx="0" cy="0" r="3.5"/>
    </g>

  </g>
</svg>
