     the motif repeats every 341.33 x 213.33 and the viewBox is exactly 4 x 6 of
     those, so it repeats seamlessly with no seam handling.
     Drawn in Aegean blue at low opacity rather than the source black — at full
     strength the key fights every piece of text laid over it. -->
