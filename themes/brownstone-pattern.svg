<!-- Sidecar — Brownstone background pattern.
     A 320x320 tile of interlocking courses, the way brownstone facades were cut and
     laid. Faint enough that text sits comfortably on top of it: something you notice
     on the second look.

     Drawn THREE times, as a relief lit from above, and the geometry is the whole
     point. Brick and mortar are not in the same plane: the joint is recessed behind
     the face of the stone. So with light coming down the wall —

       the joint BELOW a stone is dark, because the stone above overhangs it and
       casts down into it;
       the joint ABOVE a stone is bright, because that is the stone's own top edge
       turned up toward the light.

     Which is why the offsets are vertical and asymmetric, not a diagonal nudge: the
     shadow copy sits 2.2px DOWN and the highlight 1.1px UP, with the face painted
     last over both, so each leaves only its own band showing in the joint. Shadow
     is the stronger of the two, as it is on a real wall in raking light.

     The two passes are tuned separately because they carry different parts of the
     panel. The shadow is what reads inside the pool of light, where the ground is
     bright and a light fill has nowhere to go; the highlight is what reads out in
     the dark, where the shadow has nowhere to go. So the shadow is set by the lit
     area and the highlight by the unlit one.

     Two earlier versions got this wrong in instructive ways. The first was a single
     light fill on the reasoning that "on a dark ground the pattern has to be lighter
     than the field to read at all" — true until the theme lit the wall with a
     gaslamp (themes/patterns.css), after which the ground came up to meet the
     limestone inside the pool of light and the courses washed out exactly where you
     were looking. The second answered that with a dark copy offset diagonally, which
     restored the contrast but described no light source in particular; the mortar
     read as a smudge rather than as a recess.

     One <use> per pass rather than three copies of a 6KB path. -->
