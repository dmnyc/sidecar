<!--
  Metropolis, the sunburst for the full-tab composer: metropolis-rays.svg's fan, the same
  58 rays and spine at the same angles and weights, in a frame 960 wide instead of 400
  with the vertex recentered. The panel's file is used at 100% of the panel's width; on a
  1440px tab that drew every ray at 3.6 times the panel's weight. This one, used the same
  way, draws them at about 1.5. Edit metropolis-rays.svg's notes for why it is built as
  it is; keep the two fans identical apart from the frame.
-->
