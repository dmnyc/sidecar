<!-- Sidecar — Bauhaus background pattern.
     Quarter-discs, circles and rings on a 4x4 grid of 120px cells, so the 480x480 tile
     repeats seamlessly: every motif is wholly contained in its own cell and nothing
     crosses an edge.
     CURVES ONLY, no squares. Brownstone shipped with a coffer tile and then swapped it
     out because it "sat too close to Aegean's meander: both are orthogonal hard-edged
     geometry, so they read as the same idea however they are scaled." A Bauhaus grid of
     squares would walk into exactly that. The arcs are the whole silhouette.
     Drawn in the theme ink at low opacity — see patterns.css for the scale. Solid
     quadrants cover far more area than Aegean's hairline key, so this needs a lower
     opacity than that tile does to sit equally quiet under text. -->
<svg width="480" height="480" viewBox="0 0 480 480" fill="none" xmlns="http://www.w3.org/2000/svg">
<g fill="#1D1D2B" opacity="0.055">
  <path d="M0,0 L120,0 A120,120 0 0 1 0,120 Z"/>
  <circle cx="180" cy="60" r="53" fill="none" stroke="#1D1D2B" stroke-width="14"/>
  <path d="M360,120 L240,120 A120,120 0 0 1 360,0 Z"/>
  <path d="M240,120 L240,240 A120,120 0 0 1 120,120 Z"/>
  <circle cx="420" cy="180" r="60"/>
  <circle cx="60" cy="300" r="60"/>
  <path d="M240,360 L240,240 A120,120 0 0 1 360,360 Z"/>
  <path d="M360,240 L480,240 A120,120 0 0 1 360,360 Z"/>
  <path d="M120,480 L0,480 A120,120 0 0 1 120,360 Z"/>
  <circle cx="300" cy="420" r="53" fill="none" stroke="#1D1D2B" stroke-width="14"/>
</g>
</svg>
