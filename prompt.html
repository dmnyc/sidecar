<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sidecar</title>
  <link rel="stylesheet" href="fonts.css" />
  <style>
    :root {
      /* Theme-specific color variables are loaded from themes/*.css */
      color-scheme: dark; /* dark-only UI — keep native controls dark in Light Mode */
      --font-display: 'Playfair Display', Georgia, serif;
      --font-ui: 'Manrope', system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;

      /* Default fallback colors (will be overridden by theme files). Matches
         styles.css's :root so every var a theme file sets has a fallback here —
         a missing var leaves a hardcoded literal unreachable by the override. */
      --bg: #0a0118;
      --bg-2: #140428;
      --velvet-1: #23114a;
      --velvet-2: #160a30;
      --velvet-1-rgb: 35, 17, 74;
      --av-from: #2a1257;
      --av-to: #160a30;
      --banner-accent: #3a2470;
      --border: rgba(167, 139, 250, 0.16);
      --border-strong: rgba(167, 139, 250, 0.28);
      --border-rgb: 167, 139, 250;
      --well-rgb: 8, 2, 20;
      --warn: #ffb38a;
      --warn-rgb: 255, 179, 138;
      --success: #6ee7a8;
      --success-rgb: 110, 231, 168;
      --orange: #ea772f;
      --gold: #cba14e;
      --gold-soft: rgba(203, 161, 78, 0.5);
      --purple: #a78bfa;
      --lav: #bda1ff;
      --text: #f1e8f8;
      --muted: #9a86c4;
      --faint: #6f5fa0;
      --red: #f0566b;
      --btn-primary-top: #f29248;
      --btn-primary-mid: var(--orange);
      --btn-primary-bot: #d4621f;
      --btn-primary-text: #1c0c00;
      --btn-shadow: rgba(234, 119, 47, 0.28);
      --sheen: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      --pattern-opacity: 1;
    }
  </style>
  <link rel="stylesheet" href="themes/speakeasy.css" />
  <link rel="stylesheet" href="themes/film-noir.css" />
  <link rel="stylesheet" href="themes/art-deco.css" />
  <link rel="stylesheet" href="themes/aegean.css" />
  <link rel="stylesheet" href="themes/brownstone.css" />
  <link rel="stylesheet" href="themes/bauhaus.css" />
  <link rel="stylesheet" href="themes/populuxe.css" />
  <link rel="stylesheet" href="themes/nixie.css" />
  <link rel="stylesheet" href="themes/cast-iron.css" />
  <link rel="stylesheet" href="themes/patterns.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      font-family: var(--font-ui);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      background-color: var(--bg);
      background-repeat: repeat, no-repeat, no-repeat, no-repeat;
      background-attachment: fixed;
    }
    body { text-align: center; }
    /* Scrollable content + a footer that keeps Allow/Reject in view no matter how
       tall the body grows (heads-up card, preview, switch menu, unlock field). */
    /* The scrollable content fades out at its bottom edge, so text visibly
       dissolves above the buttons — an unmistakable "there's more to scroll". */
    .prompt-scroll {
      flex: 1 1 auto; overflow-y: auto; padding: 22px 22px 6px;
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 30px), transparent);
      mask-image: linear-gradient(to bottom, #000 calc(100% - 30px), transparent);
    }
    .prompt-footer {
      flex-shrink: 0;
      padding: 12px 22px 18px;
      border-top: 1px solid var(--border);
      background: rgba(var(--well-rgb), 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    /* Everything the user ACTS on lives in the footer — PIN, the budget toggle, the
       relax chips, the buttons. The body above holds what they're deciding about and
       is the only part that scrolls. Anything interactive left in the body can be
       scrolled out of reach with nothing to suggest it's there, which is how the
       relax chips went missing once the PIN stopped scrolling.
       The hairline sits on the footer itself so it lands correctly whichever of these
       is visible — they're conditional, and #relax-row and #remember never co-occur
       (signing vs payment). */
    .prompt-footer #unlock { margin-bottom: 12px; }
    .prompt-footer #unlock input[type=password] { margin-bottom: 0; }
    .prompt-footer #pin-error { margin: 7px 0 0; }
    .prompt-footer #relax-row,
    .prompt-footer #autozap-offer,
    .prompt-footer #remember { margin-bottom: 10px; }
    /* The chips are the last thing in the relax row; its own margin spaces them from
       the buttons, so don't pay twice. */
    .prompt-footer .relax-chips { margin-bottom: 0; }
    /* .error reserves 18px + 8px so the body layout can't jump when a message
       appears. In the footer that reservation is permanent dead space above the
       buttons on every prompt — and the footer is the last thing on screen, so
       nothing below it can be pushed around. Collapse it until it has something
       to say. */
    .prompt-footer .error:empty { display: none; }
    /* The relax heading is a Playfair display line sized for the body; in the footer
       it only needs to label three chips. */
    .prompt-footer .relax-label { font-size: 13px; margin-bottom: 7px; }
    .brand { display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
    .brand img { height: 26px; width: auto; display: block; filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4)); }
    .host {
      font-family: var(--font-display); font-weight: 700;
      font-size: 19px; color: var(--lav);
      word-break: break-all; margin-bottom: 3px;
    }
    .ask { font-size: 14px; color: var(--muted); margin-bottom: 18px; }
    .shared-note {
      margin: 2px 0 14px; padding: 9px 11px; border-radius: 9px;
      background: rgba(203, 161, 78, 0.1); border: 1px solid var(--gold-soft);
      color: var(--text); font-size: 12px; line-height: 1.45; text-align: left;
    }
    .shared-headsup {
      margin: 2px 0 14px; padding: 11px 12px; border-radius: 10px;
      background: rgba(203, 161, 78, 0.1); border: 1px solid var(--gold-soft); text-align: left;
    }
    .shared-headsup-title { color: var(--gold); font-weight: 700; font-size: 13px; margin-bottom: 6px; }
    .shared-headsup-body { margin: 0 0 10px; color: var(--text); font-size: 12px; line-height: 1.45; }
    .shared-headsup-btn {
      display: block; width: 100%; padding: 8px; border-radius: 8px; cursor: pointer;
      background: rgba(203, 161, 78, 0.16); border: 1px solid var(--gold-soft);
      color: var(--gold); font-weight: 600; font-size: 12.5px;
    }
    .shared-headsup-btn:hover { filter: brightness(1.12); }
    .shared-caption {
      margin: 2px 0 8px; text-align: center;
      color: var(--muted); font-size: 11.5px; letter-spacing: 0.02em;
    }
    .card {
      position: relative; text-align: left;
      background: linear-gradient(160deg, var(--velvet-1), var(--velvet-2));
      border: 1px solid var(--border); border-radius: 12px;
      padding: 13px; margin-bottom: 16px; font-size: 13px;
      box-shadow: var(--sheen);
    }
    .card .row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
    .card .row span:first-child { color: var(--muted); }
    .card .row span:last-child { word-break: break-all; text-align: right; font-family: var(--font-mono); font-size: 12px; }
    pre {
      background: rgba(var(--well-rgb), 0.6); border-radius: 8px; padding: 10px; margin: 8px 0 0;
      font-family: var(--font-mono);
      font-size: 12px; white-space: pre-wrap; word-break: break-word;
      max-height: 160px; overflow: auto; color: var(--text);
    }
    /* Event-content preview: short by default (keeps the account card in view),
       expandable, with a Formatted/Raw toggle for note-like kinds. */
    .evpreview {
      background: rgba(var(--well-rgb), 0.6); border-radius: 8px; padding: 10px; margin: 8px 0 0;
      font-size: 12.5px; line-height: 1.5; color: var(--text); text-align: left;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .evpreview.mono { font-family: var(--font-mono); font-size: 12px; }
    .evpreview.clamped {
      max-height: 120px; overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 24px), transparent);
      mask-image: linear-gradient(to bottom, #000 calc(100% - 24px), transparent);
    }
    .evpreview:not(.clamped) { max-height: 320px; overflow-y: auto; }
    .evpreview .ev-media { display: block; max-width: 100%; max-height: 220px; border-radius: 7px; margin: 6px 0; }
    .evpreview .ev-mention { color: var(--lav); }
    .evpreview .ev-ref { color: var(--muted); }
    .evpreview a { color: var(--lav); word-break: break-all; }
    .evpreview-controls { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 7px; }
    .evpreview-modes { display: flex; gap: 12px; }
    .evpreview-mode {
      background: none; border: none; padding: 2px 0; cursor: pointer;
      color: var(--muted); font-size: 11.5px; font-family: inherit;
    }
    .evpreview-mode:hover { color: var(--text); }
    .evpreview-mode.active { color: var(--lav); font-weight: 600; }
    .evpreview-toggle {
      background: none; border: none; padding: 2px 0; cursor: pointer;
      color: var(--lav); font-size: 11.5px; font-family: inherit;
    }
    .evpreview-toggle:hover { color: var(--text); }
    .kind-warn {
      margin-top: 8px; padding: 8px 10px; border-radius: 8px;
      background: rgba(var(--warn-rgb), 0.1); border: 1px solid rgba(var(--warn-rgb), 0.3);
      color: var(--warn); font-size: 12px; text-align: left;
    }
    /* Destructive replaceable overwrite — louder than .kind-warn above, which only
       says "unusual kind". This means data you already have is about to be erased.
       Set as an editorial aside (rule + Playfair headline) rather than a nested red
       box, which read as a stray browser error inside the preview card. Mirrors
       .destructive-warn in styles.css; this window carries its own styles. */
    .destructive-warn {
      margin-top: 12px; padding: 1px 0 1px 12px; text-align: left;
      border-left: 2px solid var(--red);
    }
    .destructive-warn-title {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--font-display); font-weight: 700; font-size: 15px;
      color: var(--red); letter-spacing: 0.01em; margin-bottom: 3px;
    }
    .destructive-warn-title svg { width: 14px; height: 14px; flex-shrink: 0; }
    .destructive-warn-body { margin: 0; color: var(--text); font-size: 13px; line-height: 1.5; }
    /* --muted, not --faint: --faint fails WCAG AA contrast in every theme at this
       size. See the matching note in styles.css. */
    .destructive-warn-hint {
      margin: 6px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.5;
    }
    /* Reject inside the warning, styled as the affirmative action — the red here means
       "keep my data". The acknowledgement is deliberately quieter. */
    .destructive-warn-actions { display: flex; flex-direction: column; gap: 7px; margin-top: 11px; }
    /* Uppercased in CSS so screen readers still announce "Don't allow". */
    .destructive-warn-reject {
      width: 100%; padding: 9px 12px; border-radius: 8px; cursor: pointer;
      background: var(--red); border: 1px solid var(--red); color: #fff;
      font-family: inherit; font-size: 13px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .destructive-warn-reject:hover { filter: brightness(1.08); }
    .destructive-warn-ack {
      width: 100%; padding: 7px 12px; border-radius: 8px; cursor: pointer;
      background: transparent; border: 1px solid var(--border-strong); color: var(--muted);
      font-family: inherit; font-size: 12px;
    }
    .destructive-warn-ack:hover { color: var(--text); border-color: var(--muted); }
    .destructive-warn-unlocked { margin: 9px 0 0; color: var(--muted); font-size: 12px; font-style: italic; }
    .approval-locked #allow, .approval-locked #trust {
      opacity: 0.4; cursor: not-allowed; filter: grayscale(0.5);
    }
    .info-note {
      margin-bottom: 16px; padding: 9px 11px; border-radius: 8px;
      background: rgba(var(--border-rgb), 0.08); border: 1px solid rgba(var(--border-rgb), 0.22);
      color: var(--muted); font-size: 11.5px; line-height: 1.45; text-align: left;
    }
    .account { margin-bottom: 18px; }
    .switch-toggle {
      display: block; width: 100%; background: none; border: none; cursor: pointer;
      color: var(--lav); font-size: 12.5px; text-align: center; margin: -10px 0 14px; padding: 4px;
    }
    .switch-toggle:hover { color: var(--text); }
    .switch-menu {
      text-align: left;
      background: linear-gradient(180deg, var(--velvet-1), var(--velvet-2));
      border: 1px solid var(--border-strong); border-radius: 14px;
      padding: 6px; margin: -6px 0 14px; box-shadow: var(--sheen);
    }
    /* "Wrong account?" hint — mirrors .approval-wrong-acct in styles.css. Same muted
       weight as .trust-nudge, which is the other advisory line on this screen; it must
       not compete with the destructive banner or read as something being wrong. */
    .wrong-acct {
      font-size: 12.5px; line-height: 1.45; color: var(--muted);
      text-align: center; margin: -8px 0 14px;
    }
    .wrong-acct strong { display: block; color: var(--text); font-weight: 600; }
    /* Reads as a link, not a button — see .approval-wrong-acct-toggle in styles.css for
       why this is --muted rather than the --lav accent. */
    .wrong-acct-toggle {
      background: none; border: none; padding: 2px 4px; cursor: pointer;
      font: inherit; color: var(--muted); text-decoration: underline;
    }
    .wrong-acct-toggle:hover { color: var(--text); }
    .wrong-acct-list {
      text-align: left; margin: 8px 0 0; padding: 6px;
      background: linear-gradient(180deg, var(--velvet-1), var(--velvet-2));
      border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: var(--sheen);
    }
    .wrong-acct-lede { margin: 2px 6px 8px; font-size: 12px; line-height: 1.45; color: var(--muted); }
    .wrong-acct-tag {
      margin-left: auto; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); white-space: nowrap;
    }
    .switch-row {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      background: transparent; border: none; cursor: pointer; color: var(--text);
      padding: 9px 10px; border-radius: 10px; font-family: inherit; font-weight: 400;
    }
    .switch-row:hover { background: rgba(var(--border-rgb), 0.1); }
    .switch-row.active { background: rgba(203, 161, 78, 0.08); }
    .switch-row-av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--av-from); }
    .switch-row-info { flex: 1; min-width: 0; }
    .switch-row-name { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .switch-row-npub { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .switch-row-check { width: 16px; height: 16px; color: var(--gold); flex-shrink: 0; }
    .as-label { font-size: 10.5px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.22em; }
    .acct-capsule {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      background: linear-gradient(150deg, var(--velvet-1), var(--velvet-2));
      border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; box-shadow: var(--sheen);
    }
    .acct-av { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--av-from); box-shadow: 0 0 0 1px var(--gold-soft); }
    .acct-meta { min-width: 0; text-align: center; }
    .acct-name { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .acct-np { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); margin-top: 4px; word-break: break-all; }
    label { display: block; font-size: 12px; letter-spacing: 0.03em; color: var(--muted); margin: 0 0 6px; }
    input[type=password] {
      width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--input-bg, linear-gradient(180deg, rgba(var(--well-rgb), 0.6), rgba(var(--velvet-1-rgb), 0.6)));
      color: var(--text); font-size: 16px; margin-bottom: 8px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type=password]:focus { outline: none; border-color: var(--gold-soft); box-shadow: 0 0 0 3px rgba(203, 161, 78, 0.16); }
    .remember { margin-bottom: 14px; }
    .remember .check { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text); font-size: 13px; text-transform: none; letter-spacing: 0; margin-bottom: 8px; cursor: pointer; }
    .remember input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--orange); cursor: pointer; }
    .budget-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .remember input[type=number] {
      width: 110px; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--input-bg, linear-gradient(180deg, rgba(var(--well-rgb), 0.6), rgba(var(--velvet-1-rgb), 0.6)));
      color: var(--text); font-size: 14px; font-family: var(--font-mono);
    }
    .remember input[type=number]:focus { outline: none; border-color: var(--gold-soft); }
    .remember input[type=number]:disabled { opacity: 0.4; cursor: not-allowed; }
    .budget-unit { font-size: 12.5px; color: var(--muted); }
    .error { color: var(--red); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
    .actions { display: flex; flex-direction: column; gap: 8px; }
    button {
      width: 100%; padding: 12px; border-radius: 10px; border: none; cursor: pointer;
      font-family: inherit; font-size: 14px; font-weight: 600; letter-spacing: 0.01em;
      transition: transform 0.12s, filter 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .primary {
      background: linear-gradient(180deg, var(--btn-primary-top, #f29248), var(--btn-primary-mid, var(--orange)) 55%, var(--btn-primary-bot, #d4621f));
      color: var(--btn-primary-text, #1c0c00);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 8px 22px var(--btn-shadow, rgba(234, 119, 47, 0.28));
    }
    .primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
    /* Mirrors .lav-btn in styles.css — see there for why the stops and label are
       variables, and why the ring is an inset shadow rather than a border. */
    .lav-btn {
      background: linear-gradient(180deg, var(--btn-lav-top, #cebfff), var(--btn-lav-mid, var(--lav)) 58%, var(--btn-lav-bot, var(--purple)));
      color: var(--btn-lav-text, #190a33);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        inset 0 0 0 1px var(--btn-lav-ring, transparent),
        0 8px 22px var(--btn-lav-shadow, rgba(var(--border-rgb), 0.24));
    }
    .lav-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
    /* Mirrors .secondary in styles.css — see there for why these are separate hooks. */
    .secondary {
      background: linear-gradient(180deg, var(--btn-secondary-top, var(--velvet-1)), var(--btn-secondary-bot, var(--velvet-2)));
      color: var(--btn-secondary-text, var(--text)); border: 1px solid var(--border); box-shadow: var(--sheen);
    }
    .secondary:hover { border-color: var(--gold-soft); }
    .ghost { background: transparent; color: var(--muted); }
    .ghost:hover { color: var(--text); }
    .relax-row { margin: 0 0 16px; text-align: center; }
    .relax-label { font-family: var(--font-display); font-size: 15px; color: var(--gold); font-weight: 700; letter-spacing: 0.01em; margin-bottom: 10px; text-align: center; }
    .relax-chips { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
    .relax-chip {
      width: auto; flex: 1; padding: 9px 6px; border-radius: 10px; cursor: pointer;
      background: linear-gradient(180deg, var(--velvet-1), var(--velvet-2));
      border: 1px solid var(--border); color: var(--text);
      font-family: inherit; font-size: 13px; font-weight: 600;
    }
    .relax-chip:hover { border-color: var(--gold-soft); filter: brightness(1.06); }
    .relax-chip:disabled { opacity: 0.45; cursor: not-allowed; }
    /* Advice, not a warning — muted, so it doesn't compete with the destructive
       banner or read as something being wrong. The site name inside is lavender to
       tie it to "Trust this site" right below. */
    .trust-nudge { font-size: 12.5px; line-height: 1.45; color: var(--muted); text-align: center; margin: 0 0 12px; }
    .trust-nudge strong { color: var(--lav); font-weight: 600; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="prompt-scroll">
    <div class="brand"><img src="icons/sidecar-logo.svg" alt="Sidecar" /></div>
    <div class="host" id="host">…</div>
    <div class="ask" id="ask">wants to…</div>

    <!-- Account capsule ABOVE the event preview: "Signing as" is context, not
         detail — it belongs with the host name, before the thing being signed.
         Below the preview it was pushed off-screen by a long event, defeating
         the clamp's own comment ("keeps the account card in view"). -->
    <div class="account" id="account"></div>
    <button class="switch-toggle hidden" id="switch-toggle">Sign in with a different account</button>
    <div class="switch-menu hidden" id="switch-menu"></div>
    <!-- "Wrong account?" escape — mirrors #approval-wrong-acct in sidepanel.html. Shown
         on a content sign whenever an account exists that the switcher above can't offer.
         Copy must stay in step with the panel's. -->
    <div class="wrong-acct hidden" id="wrong-acct">
      <strong>Not the right account?</strong>
      <button class="wrong-acct-toggle" id="wrong-acct-toggle" aria-expanded="false">Detach and use another identity.</button>
      <div class="wrong-acct-list hidden" id="wrong-acct-list"></div>
    </div>

    <div id="preview" class="card hidden"></div>

    <div id="decrypt-note" class="info-note hidden"></div>


  </div>

  <div class="prompt-footer">
    <!-- The PIN lives in the FOOTER, not the scrolling body. It is the action the
         button beside it demands, so it must not be able to scroll out of view — and
         .prompt-scroll fades its own bottom edge, which was leaving the field
         half-transparent before it even left the viewport. -->
    <div id="unlock" class="hidden">
      <label for="pin">Enter your PIN to unlock</label>
      <input type="password" id="pin" autocomplete="off" maxlength="32" autofocus />
      <!-- PIN failures belong against the PIN, not two controls further down next to
           the buttons — this is where "N attempts left before all data is erased"
           lands. #error below stays for everything else (the budget message, which is
           already adjacent to the budget row). -->
      <div class="error" id="pin-error"></div>
    </div>
    <!-- Offered by the payment card; confirmed here because a page must not be able
         to switch automatic spending on by itself. Ticked by default since the user
         already asked for it on the card — untick to pay without enabling it. -->
    <div id="autozap-offer" class="remember hidden">
      <label class="check"><input type="checkbox" id="autozap-offer-box" checked />
      <span id="autozap-offer-label">Turn on Auto Zaps</span></label>
    </div>

    <div id="remember" class="remember hidden">
    <label class="check"><input type="checkbox" id="remember-budget" /> Allow this site to spend up to</label>
    <div class="budget-row">
      <input type="number" id="budget-amount" min="1" placeholder="sats" />
      <span class="budget-unit">sats / day without asking</span>
    </div>
    </div>
    <div id="relax-row" class="relax-row hidden">
    <div class="relax-label">Auto-sign for the next</div>
    <div class="relax-chips">
      <button type="button" class="relax-chip" data-mins="5">5 min</button>
      <button type="button" class="relax-chip" data-mins="15">15 min</button>
      <button type="button" class="relax-chip" data-mins="30">30 min</button>
    </div>
    </div>
    <div class="error" id="error"></div>
    <!-- Shown once you've approved this site a few times over. Nothing else on this
         screen says which button ends the asking, and "Allow once" is the one that
         looks like the default answer. Sits directly above the buttons so it reads as
         a label for the one below it. -->
    <div id="trust-nudge" class="trust-nudge hidden"></div>
    <div class="actions">
      <button class="primary" id="allow">Allow once</button>
      <button class="lav-btn" id="trust">Trust this site</button>
      <button class="ghost" id="reject">Reject</button>
    </div>
  </div>

  <script src="prompt.js"></script>
</body>
</html>
