<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="Write in Sidecar">Write in Sidecar</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="themes/speakeasy.css" />
  <link rel="stylesheet" href="themes/film-noir.css" />
  <link rel="stylesheet" href="themes/industria.css" />
  <link rel="stylesheet" href="themes/aegean.css" />
  <link rel="stylesheet" href="themes/brownstone.css" />
  <link rel="stylesheet" href="themes/bauhaus.css" />
  <link rel="stylesheet" href="themes/populuxe.css" />
  <link rel="stylesheet" href="themes/nixie.css" />
  <link rel="stylesheet" href="themes/cast-iron.css" />
  <link rel="stylesheet" href="themes/metropolis.css" />
  <link rel="stylesheet" href="themes/par-avion.css" />
  <link rel="stylesheet" href="themes/werkstatte.css" />
  <link rel="stylesheet" href="themes/wabi-sabi.css" />
  <link rel="stylesheet" href="themes/ukiyo-e.css" />
  <link rel="stylesheet" href="themes/constellation.css" />
  <link rel="stylesheet" href="themes/mycelium.css" />
  <link rel="stylesheet" href="themes/patterns.css" />
  <!-- Marks which Constellation plate this session shows; see sky-plate.js. In the head
       and synchronous, so the mark is set before the first paint. -->
  <script src="sky-plate.js"></script>
  <!-- The last theme this tab drew with, and the card held back until it is built; see
       compose-boot.js. Synchronous and in the head for the same reason as the line above. -->
  <script src="compose-boot.js"></script>
</head>
<body class="compose-page">
  <!-- Same bar as the guide and the app directory: 12px padding around a 22px wordmark,
       so a Sidecar page looks like a Sidecar page wherever you arrive at one. What it
       does not borrow is that bar's hardcoded dark background, which is Speakeasy's and
       nobody else's. This one is drawn from the theme variables, so it follows the
       account you are writing as. -->
  <header class="compose-topbar">
    <span class="compose-brand">
      <img id="compose-logo" src="icons/sidecar-logo.svg" alt="Sidecar" draggable="false">
    </span>
  </header>

  <div class="compose-body">
    <main class="compose-sheet">
      <!-- The card's own corner, the same slot every sheet in the panel puts its close box
           in. The page bar above belongs to Sidecar; this one belongs to the note. -->
      <button type="button" class="modal-x compose-x" id="compose-x" title="Close" data-i18n-title="Close"></button>
      <!-- This account's other drafts, beside the close box as in the panel's composer:
           both leave the draft on screen, which the Write / Preview row never does.
           Hidden while there is nothing else saved. -->
      <button type="button" class="modal-x compose-drafts-btn hidden" id="compose-drafts-btn" title="Saved drafts" data-i18n-title="Saved drafts"><span class="compose-drafts-count" id="compose-drafts-count" aria-hidden="true"></span></button>

      <header class="compose-head">
        <div class="compose-who">
          <span class="avatar compose-av" id="compose-av"></span>
          <span class="compose-who-text">
            <span class="compose-name" id="compose-name" data-i18n="Loading…">Loading…</span>
            <span class="compose-sub" id="compose-sub" data-i18n="Writing as this account">Writing as this account</span>
          </span>
        </div>
      </header>

      <!-- What is being answered, when this tab was opened from a reply. Above the tabs,
           not inside a pane: it is the subject, so switching to Preview must not hide it.
           Same reasoning and same classes as the panel's own reply block. -->
      <div class="reply-target hidden" id="compose-reply-target"></div>

      <div class="compose-tabs" id="compose-tabs">
        <button type="button" class="compose-tab active" id="tab-write" data-i18n="Write">Write</button>
        <button type="button" class="compose-tab" id="tab-preview" data-i18n="Preview">Preview</button>
      </div>

      <div id="compose-slot"></div>
      <!-- The review window lands here rather than over the card, so canceling it puts the
           editor back exactly as it was instead of rebuilding it around a lost caret. -->
      <div class="compose-countdown hidden" id="compose-countdown"></div>
      <div class="compose-preview compose-preview-lg hidden" id="compose-preview"></div>
      <div class="compose-drafts-pane hidden" id="compose-drafts-pane"></div>
      <div class="compose-thumbs" id="compose-thumbs"></div>

      <div class="compose-actions" id="compose-actions"></div>
      <p class="error" id="compose-err"></p>

      <footer class="compose-foot">
        <!-- The same setting as Settings → Posting → Where to write, offered where the
             question answers itself: someone writing in the tab is deciding whether they
             want to start here next time. Same words, so the two read as one switch. -->
        <label class="switch-label compose-default">
          <span class="switch">
            <input type="checkbox" id="compose-default-toggle" />
            <span class="switch-track"></span>
          </span>
          <span data-i18n="Always use the full-size composer">Always use the full-size composer</span>
        </label>
        <span class="compose-status" id="compose-status"></span>
        <span class="compose-count" id="compose-count"></span>
        <!-- Not a button. Leaving is not an action with the same weight as publishing, and
             two buttons side by side say they are. -->
        <button type="button" class="compose-cancel" id="compose-close" data-i18n="Cancel">Cancel</button>
        <button type="button" class="primary compose-post" id="compose-post" disabled data-i18n="Post">Post</button>
      </footer>
    </main>
  </div>

  <!-- Same id and class the panel uses, so styles.css dresses it without a second rule. -->
  <div id="toasts" class="toasts"></div>

  <script src="i18n.js"></script>
  <script src="nostr-tools.js"></script>
  <script src="ws-guard.js"></script>
  <script src="composer-core.js"></script>
  <script src="compose.js"></script>
</body>
</html>
