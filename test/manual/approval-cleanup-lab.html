<!--
  Approval cleanup lab: the subset of the approval gallery that changed in the "say what it is, keep
  the string behind a link" round. Same setup as the gallery.
      python3 -m http.server 8021        (from the repo root)
      open http://localhost:8021/test/manual/approval-cleanup-lab.html
  Connect once with a TEST account, with the site at Ask. Nothing publishes; Reject is always safe.
-->
<!doctype html>
<meta charset="utf-8">
<title>Sidecar approval cleanup lab</title>
<style>
  body { margin: 0; font: 15px/1.55 ui-sans-serif, system-ui, sans-serif; background: #12101a; color: #e7e3f0; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 24px 140px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 38px 0 4px; padding-top: 14px; border-top: 1px solid #2c2740; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  h2 button { font-size: 12.5px; padding: 4px 10px; }
  .sub, .muted { color: #9a93b0; }
  .sub { margin: 0 0 18px; }
  .bar { position: sticky; top: 0; z-index: 2; background: #12101aee; backdrop-filter: blur(6px); border-bottom: 1px solid #2c2740;
         padding: 10px 0; margin: 0 0 18px; display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
  .pill { border: 1px solid #3a3352; border-radius: 99px; padding: 2px 10px; }
  .pill.ok { border-color: #3f7a55; color: #9be0b4; }
  button { font: inherit; font-size: 13.5px; cursor: pointer; border-radius: 8px; padding: 6px 12px; border: 1px solid #4a4068; background: #1d1830; color: #e7e3f0; }
  button:hover { border-color: #8b7bd0; }
  button:disabled { opacity: .5; cursor: default; }
  .case { border: 1px solid #2c2740; border-radius: 12px; padding: 12px 16px; margin: 0 0 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: start; }
  .case.now { border-color: #8b7bd0; background: #171426; }
  .case h3 { font-size: 15px; margin: 0; }
  .case .look { grid-column: 1; color: #c9c2dd; font-size: 13.5px; margin: 0; }
  .case .look::before { content: '✓  '; color: #6b5bb0; }
  .case .go { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  .case .out { grid-column: 1 / -1; font: 12px ui-monospace, monospace; color: #7fb8a0; word-break: break-all; min-height: 1em; }
  .case .out.err { color: #c9a0a8; }
  .why { color: #9a93b0; font-size: 13.5px; margin: 2px 0 12px; }
  code { font: 12.5px ui-monospace, monospace; color: #b7aee0; }
  .known { margin: 8px 0; padding: 8px 10px; border-radius: 8px; background: #2a1d10; border: 1px solid #6b4a1e; color: #e8c79a; font-size: 13.5px; }
</style>
<div class="wrap">
  <h1>Approval cleanup lab</h1>
  <p class="sub">Just the cards cleaned up in this round: JSON fields, ciphertext and encoded content on sign cards,
  wallet connections to seal, and batches of both. The full set is in the <a href="approval-gallery.html">approval gallery</a>.
  <b>Reject</b> anything you only want to look at.</p>
  <div class="bar">
    <button id="connect">Connect with Nostr</button>
    <span id="nostr" class="pill">window.nostr…</span>
    <span id="webln" class="pill">window.webln…</span>
    <span class="muted" id="pk">not connected</span>
  </div>

  <div id="groups"></div>
</div>

<script>
  const $ = (s, r = document) => r.querySelector(s);
  const now = () => Math.floor(Date.now() / 1000);
  const PEER = '79be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798'; // a valid key that is not yours
  let SELF = '';
  const hex = (n) => Array.from({ length: n }, (_, i) => '0123456789abcdef'[(i * 7 + 3) % 16]).join('');
  const ev = (kind, content, tags = []) => ({ kind, content, tags, created_at: now() });
  const sign = (e) => async () => { const r = await window.nostr.signEvent(e); return 'signed, id ' + r.id.slice(0, 12) + '… (discarded)'; };
  const enc44 = (text, to) => async () => { await window.nostr.nip44.encrypt(to || SELF, text); return 'sealed (discarded)'; };
  const enc04 = (text) => async () => { await window.nostr.nip04.encrypt(SELF, text); return 'sealed (discarded)'; };

  // The wallet connection an app stores for itself (a made-up one: no real wallet or key).
  const WALLET = 'nostr+walletconnect://' + hex(64) + '?relay=wss%3A%2F%2Frelay.example.com&relay=wss://relay2.example.com&secret=' + hex(64);
  const SETTINGS_JSON = JSON.stringify({ theme: 'dark', relays: ['wss://relay.example.com'], zapDefault: 21, lang: 'en', hideBalances: false, pinned: ['note1', 'note2'] });
  const BLOB = btoa(String.fromCharCode(...Array.from({ length: 150 }, (_, i) => (i * 37 + 11) % 256))).replace(/=+$/, '');
  const NIP04_CT = btoa('a sealed message of some length, long enough to look right') + '?iv=' + btoa('0123456789abcdef');

  // A BOLT11-shaped invoice that passes Sidecar's own checks and that no wallet can settle.
  const CS = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
  const enc = (n) => { let s = ''; for (let i = 6; i >= 0; i--) s += CS[(n >> (5 * i)) & 31]; return s; };
  const words = (text) => { const w = []; let acc = 0, bits = 0; for (const b of new TextEncoder().encode(text)) { acc = (acc << 8) | b; bits += 8; while (bits >= 5) { bits -= 5; w.push((acc >> bits) & 31); } } if (bits) w.push((acc << (5 - bits)) & 31); return w; };
  const invoice = (amount, memo) => { const w = words(memo || ''); const tag = memo ? CS[13] + CS[(w.length >> 5) & 31] + CS[w.length & 31] + w.map((x) => CS[x]).join('') : ''; return 'lnbc' + amount + '1' + enc(now()) + tag + 'q'.repeat(110); };

  const LONG = 'A note that keeps going. '.repeat(90);
  const GROUPS = [
    { id: 'json', title: 'JSON fields', why: 'The fields view: a list reads as a list, and a dotted name only wraps after a dot.', cases: [
      { t: 'App data (kind 30078), JSON settings', look: 'Fields (theme, relays, …), not braces.', run: sign(ev(30078, SETTINGS_JSON, [['d', 'lab/settings']])) },
      { t: 'MCP over Nostr message (kind 25910)', look: 'Says ephemeral, names the method, opens on fields.', run: sign(ev(25910, '{"jsonrpc":"2.0","id":"9eb9894f","method":"initialize","params":{"protocolVersion":"2025-06-18","clientInfo":{"name":"lab","version":"1.0"}}}', [['p', PEER]])) },
    ] },
    { id: 'sealed', title: 'Ciphertext and encoded content on sign cards', why: 'A sentence saying what it is; Raw and JSON are one tap away and show exactly what is signed.', cases: [
      { t: 'App data (kind 30078), sealed blob', look: 'Says what it is (encoded data), raw behind a link.', run: sign(ev(30078, BLOB, [['d', 'lab/sealed']])) },
      { t: 'Legacy DM (kind 4)', look: 'A direct message to a person, content hidden as sealed.', run: sign(ev(4, NIP04_CT, [['p', PEER]])) },
      { t: 'Seal (kind 13)', look: 'Says what a seal is; the wrapped content is not printed.', run: sign(ev(13, BLOB)) },
      { t: 'Gift wrap (kind 1059)', look: 'An unrecognized or wrapped kind: described, content behind a link.', run: sign(ev(1059, BLOB, [['p', PEER]])) },
      { t: 'Wallet request (kind 23194)', look: 'The unusual-for-a-site warning; encrypted content not printed.', run: sign(ev(23194, NIP04_CT, [['p', PEER]])) },
      { t: 'Seal, then sign (the two-prompt app-settings flow)', look: 'Card 1 seals the settings; card 2 signs the event carrying them and shows “Sealed content” in words.', run: async () => { const ct = await window.nostr.nip44.encrypt(SELF, SETTINGS_JSON); await window.nostr.signEvent(ev(30078, ct, [['d', 'lab/settings']])); return 'both signed (discarded)'; } },
    ] },
    { id: 'seal', title: 'Encrypt: a wallet connection', why: 'The string and its secret stay behind Show details.', cases: [
      { t: 'Encrypt a wallet connection to yourself', look: 'A wallet connection through its relays, string behind Show details, secret never shown.', run: enc44(WALLET) },
      { t: 'Encrypt a wallet connection to someone else', look: 'A To row AND the description (never the string).', run: enc44(WALLET, PEER) },
    ] },
    { id: 'batch', title: 'Batches', why: 'Each row described in words, with Show details.', cases: [
      { t: 'Three JSON settings events at once', look: 'Allow all (3); each listed by kind with its content described.', run: async () => { const r = await Promise.allSettled([1, 2, 3].map((i) => window.nostr.signEvent(ev(30078, JSON.stringify({ n: i, theme: 'dark' }), [['d', 'lab/b' + i]])))); return r.map((x) => x.status).join(', '); } },
      { t: 'Two wallet connections to seal at once', look: 'Allow all (2); “Seal to yourself”, each a wallet connection with Show details.', run: async () => { const r = await Promise.allSettled([0, 1].map((i) => window.nostr.nip44.encrypt(SELF, WALLET + '&n=' + i))); return r.map((x) => x.status).join(', '); } },
    ] },
  ];

  const groupsEl = $('#groups');
  const running = { n: 0 };
  async function runCase(c, el) {
    const out = $('.out', el);
    if (!SELF && window.nostr) { try { SELF = await window.nostr.getPublicKey(); } catch (_) {} }
    el.classList.add('now'); out.className = 'out'; out.textContent = 'waiting for you to answer the card…';
    const t0 = performance.now();
    try { const r = await c.run(); out.textContent = Math.round(performance.now() - t0) + ' ms · ' + r; }
    catch (e) { out.className = 'out err'; out.textContent = Math.round(performance.now() - t0) + ' ms · ' + (e && e.message ? e.message : e); }
    el.classList.remove('now');
  }
  for (const g of GROUPS) {
    const h = document.createElement('h2'); h.id = g.id; h.textContent = g.title;
    const walk = document.createElement('button'); walk.textContent = 'Walk this group'; h.appendChild(walk);
    groupsEl.appendChild(h);
    const why = document.createElement('p'); why.className = 'why'; why.textContent = g.why; groupsEl.appendChild(why);
    const els = [];
    for (const c of g.cases) {
      const el = document.createElement('div'); el.className = 'case';
      el.innerHTML = '<h3></h3><button class="go">Show card</button><p class="look"></p><div class="out"></div>';
      $('h3', el).textContent = c.t; $('.look', el).textContent = c.look;
      $('.go', el).addEventListener('click', () => runCase(c, el));
      groupsEl.appendChild(el); els.push([c, el]);
    }
    walk.addEventListener('click', async () => { walk.disabled = true; for (const [c, el] of els) { el.scrollIntoView({ block: 'center' }); await runCase(c, el); } walk.disabled = false; });
  }

  function paint() {
    const n = !!window.nostr, w = !!window.webln;
    $('#nostr').textContent = 'window.nostr: ' + (n ? 'yes' : 'no'); $('#nostr').classList.toggle('ok', n);
    $('#webln').textContent = 'window.webln: ' + (w ? 'yes' : 'no'); $('#webln').classList.toggle('ok', w);
  }
  paint(); setInterval(paint, 800);
  $('#connect').addEventListener('click', async () => {
    try { SELF = await window.nostr.getPublicKey(); $('#pk').textContent = 'npub key ' + SELF.slice(0, 12) + '… connected'; }
    catch (e) { $('#pk').textContent = 'refused: ' + (e && e.message ? e.message : e); }
  });
</script>
